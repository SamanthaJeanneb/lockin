name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos
        ports: ['54322:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://lifeos:lifeos@localhost:54322/lifeos
      LIFEOS_DEV_USER: ci@example.com
      ENCRYPTION_KEY: ci-only-key-not-used-for-anything-real
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Design system check
        run: npm run design:check

      - name: Unit and component tests
        run: npm test

      - name: Apply schema
        run: npm run db:migrate

      - name: Seed
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Playwright starts the dev server itself. The production build above
      # proves compilation; these tests need the dev sign-in bypass, which is
      # deliberately inert when NODE_ENV is production.
      - name: End-to-end at four viewports
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
